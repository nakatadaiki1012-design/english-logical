<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>論理表現ラボ</title>
<meta name="description" content="論理表現Ⅰ・Ⅱ・Ⅲの文法と表現を、わかる→声に出す→組み立てる→思い出す→くり返す で覚えるアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* 見た目：方眼ノート（紙・墨・緑青・朱）。数学Aラボとそろえる。英文は欧文セリフ体 */
:root {
  --bg: #f1ede4; --panel: #fbf9f4; --ink: #24282b; --muted: #6d6b63; --line: #d6d0c2; --chip: #ebe6da;
  --accent: #2c6352; --accent-ink: #fbf9f4; --accent-soft: rgba(44, 99, 82, .16);
  --warm: #b8502c; --warm-soft: rgba(184, 80, 44, .16);
  --blue: #2f5f9e; --blue-soft: rgba(47, 95, 158, .16);
  --gold: #b88a12; --ok: #2c6352; --ng: #b8502c;
  --grid: rgba(36, 40, 43, .06);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-en: "Source Serif 4", Georgia, "Times New Roman", serif;
  --r: 6px; --k: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18201c; --panel: #1f2924; --ink: #ebe8dd; --muted: #a3a89b; --line: #36443c; --chip: #28342e;
    --accent: #8cc5a6; --accent-ink: #18201c; --accent-soft: rgba(140, 197, 166, .2);
    --warm: #eda26b; --warm-soft: rgba(237, 162, 107, .2);
    --blue: #8fb5e8; --blue-soft: rgba(143, 181, 232, .2);
    --gold: #e3c15a; --ok: #8cc5a6; --ng: #eda26b;
    --grid: rgba(235, 232, 221, .06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18201c; --panel: #1f2924; --ink: #ebe8dd; --muted: #a3a89b; --line: #36443c; --chip: #28342e;
  --accent: #8cc5a6; --accent-ink: #18201c; --accent-soft: rgba(140, 197, 166, .2);
  --warm: #eda26b; --warm-soft: rgba(237, 162, 107, .2);
  --blue: #8fb5e8; --blue-soft: rgba(143, 181, 232, .2);
  --gold: #e3c15a; --ok: #8cc5a6; --ng: #eda26b;
  --grid: rgba(235, 232, 221, .06);
  color-scheme: dark;
}
:root[data-size="0"] { --k: .9; }
:root[data-size="2"] { --k: 1.14; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 上のバー */
.top {
  display: flex; align-items: center; gap: 12px; flex: none;
  padding: 7px max(16px, env(safe-area-inset-right, 0px)) 7px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1.5px solid var(--ink); background: var(--panel);
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .04em; margin: 0; white-space: nowrap; cursor: pointer; }
.brand b { color: var(--warm); }
.cnav { display: flex; gap: 2px; }
.cnav button { border: 0; background: transparent; padding: 5px 10px; font-size: 14.5px; color: var(--muted); white-space: nowrap; font-weight: 700; }
.cnav button:hover { color: var(--ink); }
.cnav button[aria-current="true"] { color: var(--ink); box-shadow: inset 0 -2.5px 0 var(--warm); }
.cnav .full { margin-left: 2px; }
.tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.ibtn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 4px 9px; font-size: 13.5px; font-weight: 700; white-space: nowrap; position: relative; }
.ibtn:hover { border-color: var(--ink); }
.badge { display: inline-block; min-width: 1.5em; padding: 0 4px; margin-left: 4px; border-radius: 9px; background: var(--warm); color: var(--panel); font-size: 11.5px; line-height: 1.5; text-align: center; }
.badge:empty { display: none; }

#view {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.btn { border: 1px solid var(--ink); background: var(--panel); border-radius: 4px; padding: 7px 14px; font-size: 14.5px; font-weight: 700; white-space: nowrap; }
.btn:hover { background: var(--chip); }
.btn.main { background: var(--accent); color: var(--accent-ink); box-shadow: 2px 2px 0 var(--ink); }
.btn.main:hover { filter: brightness(1.06); }
.btn.main:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.btn.warm { background: var(--warm); color: var(--panel); box-shadow: 2px 2px 0 var(--ink); }
.btn.ghost { border-color: var(--line); }

/* ===== ホーム ===== */
.home { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: 300px minmax(0, 1fr); }
.hero { display: flex; flex-direction: column; gap: 12px; padding: 16px; min-height: 0; overflow: hidden; }
.hero .cname { font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1.15; margin: 0; }
.hero .cdesc { color: var(--muted); margin: 0; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { border: 1px solid var(--line); border-radius: 4px; padding: 6px 4px; text-align: center; background: var(--bg); }
.stat b { display: block; font-family: var(--font-en); font-size: 22px; line-height: 1.2; }
.stat small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.hero .acts { display: flex; flex-direction: column; gap: 8px; }
.hero .acts .btn { text-align: left; overflow: hidden; text-overflow: ellipsis; }
.cycle { margin-top: auto; border-top: 1px dashed var(--line); padding-top: 10px; font-size: 13px; }
.cycle h3 { font-family: var(--font-display); font-size: 14px; margin: 0 0 6px; color: var(--muted); letter-spacing: .06em; }
.cycle ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.cycle li { display: grid; grid-template-columns: 1.6em 4.5em 1fr; gap: 4px; align-items: baseline; }
.cycle li b { font-weight: 700; }
.cycle li span { color: var(--muted); font-size: 12px; }
.taskbox { border: 1.5px solid var(--warm); border-radius: 4px; padding: 8px 10px; background: var(--warm-soft); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.taskbox b { color: var(--warm); }
.taskbox .btn { margin-left: auto; padding: 4px 10px; font-size: 13px; }

.grid { display: grid; gap: 10px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); min-height: 0; }
.tile {
  position: relative; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r);
  padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: hidden; container-type: size;
}
.tile:hover { border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.tile .no { font-family: var(--font-en); color: var(--warm); font-size: 13px; font-weight: 600; }
.tile .tg { position: absolute; right: 10px; top: 10px; font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; color: var(--muted); }
.tile .tg.ex { color: var(--blue); border-color: var(--blue); }
.tile b { font-size: clamp(14px, 13cqh, 18px); line-height: 1.3; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; flex: none; }
.tile .gl { font-size: 12.5px; line-height: 1.5; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.tile .gl::before { content: "🎯 "; }
.tile small { color: var(--muted); font-family: var(--font-en); font-size: 12.5px; line-height: 1.3; }
.tile .pips { margin-top: auto; display: flex; gap: 3px; }
.tile .pips i { width: 14px; height: 5px; border-radius: 2px; background: var(--line); }
.tile .pips i.on { background: var(--accent); }
.tile .stamp {
  position: absolute; right: 8px; bottom: 6px; font-family: var(--font-display); color: var(--warm); border: 2px solid var(--warm);
  border-radius: 50%; width: 46px; height: 46px; display: grid; place-items: center; font-size: 13px; font-weight: 800; transform: rotate(-12deg); opacity: .9;
}
.tile.task { border-color: var(--warm); border-width: 1.5px; }
.tile .tk { font-size: 11px; color: var(--warm); font-weight: 700; }
@container (max-height: 150px) { .tile .gl { display: none; } }
@container (max-height: 96px) { .tile small { display: none; } .tile b { -webkit-line-clamp: 1; } .tile .stamp { width: 36px; height: 36px; font-size: 11px; } }
@container (max-height: 70px) { .tile .tg { display: none; } }
@container (max-height: 62px) { .tile .no { display: none; } .tile .stamp { width: 30px; height: 30px; font-size: 10px; border-width: 1.5px; } }

/* ===== 単元・復習 ===== */
.unit { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.ubar { display: flex; align-items: center; gap: 10px; flex: none; }
.utitle { min-width: 0; line-height: 1.25; }
.utitle small { display: block; color: var(--muted); font-size: 12px; }
.utitle b { font-family: var(--font-display); font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.steps { margin-left: auto; display: flex; gap: 4px; }
.steps button { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 5px 9px; font-size: 13.5px; font-weight: 700; color: var(--muted); white-space: nowrap; position: relative; }
.steps button .n { margin-left: 3px; }
.steps button.done { color: var(--accent); border-color: var(--accent); }
.steps button.done::after { content: "✓"; position: absolute; top: -7px; right: -5px; font-size: 11px; background: var(--accent); color: var(--accent-ink); border-radius: 50%; width: 15px; height: 15px; line-height: 15px; text-align: center; }
.steps button[aria-current="true"] { color: var(--panel); background: var(--ink); border-color: var(--ink); }

.card {
  flex: 1; min-height: 0; position: relative; overflow: hidden; container-type: size;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
}
.cin { position: absolute; inset: 0; display: flex; flex-direction: column; padding: clamp(12px, 3.5cqmin, 28px) clamp(14px, 4.5cqw, 40px); gap: clamp(6px, 2.2cqh, 18px); }
.lab { font-size: 12.5px; color: var(--muted); letter-spacing: .06em; display: flex; align-items: center; gap: 8px; flex: none; }
.lab .pill { border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; white-space: nowrap; flex: none; }
.lab > span:not(.pill) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; } /* 説明は 2 行まで 出す */
.lab .r { margin-left: auto; }
.mid { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(6px, 2.4cqh, 20px); }
.h { font-family: var(--font-display); font-size: calc(clamp(20px, min(5.4cqw, 7cqh), 38px) * var(--k)); line-height: 1.3; margin: 0; }
.body { font-size: calc(clamp(14.5px, min(3.3cqw, 4.4cqh), 21px) * var(--k)); line-height: 1.75; margin: 0; }
.form { align-self: flex-start; border: 1.5px solid var(--ink); border-radius: 3px; padding: 4px 14px; background: var(--bg); font-weight: 700; font-size: calc(clamp(15px, min(3.4cqw, 4.6cqh), 22px) * var(--k)); }
.en { font-family: var(--font-en); font-weight: 500; font-size: calc(clamp(19px, min(5.6cqw, 7.4cqh), 42px) * var(--k)); line-height: 1.4; margin: 0; }
.en.sm { font-size: calc(clamp(17px, min(4.4cqw, 5.6cqh), 30px) * var(--k)); }
.en mark { background: var(--accent-soft); color: inherit; border-bottom: 2.5px solid var(--accent); padding: 0 2px; border-radius: 2px; }
.en .hid { color: var(--muted); letter-spacing: .04em; }
.en .hid.key { color: var(--accent); }
.en .blank { display: inline-block; min-width: 3.2em; border-bottom: 2.5px solid var(--warm); color: var(--warm); text-align: center; padding: 0 .2em; }
.en .blank.ok { color: var(--ok); border-color: var(--ok); background: var(--accent-soft); }
.ja { font-size: calc(clamp(14.5px, min(3.6cqw, 4.6cqh), 23px) * var(--k)); color: var(--muted); margin: 0; line-height: 1.6; }
.ja.big { color: var(--ink); font-size: calc(clamp(18px, min(5cqw, 6.6cqh), 36px) * var(--k)); font-weight: 700; line-height: 1.5; }
.tip { font-size: calc(clamp(13.5px, min(3cqw, 4cqh), 18px) * var(--k)); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin: 0; }
.tip.ng { border-color: var(--warm); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: none; }
.row.end { justify-content: flex-end; }
.say { border: 1px solid var(--line); background: var(--bg); border-radius: 20px; padding: 4px 12px; font-size: 14px; font-weight: 700; }
.say:hover { border-color: var(--ink); }
.say.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.reads { display: flex; gap: 4px; align-items: center; font-size: 13px; color: var(--muted); }
.reads i { width: 22px; height: 22px; border: 1.5px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; }
.reads i.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.sumlist { margin: 0; padding: 0; list-style: none; display: grid; gap: clamp(6px, 2cqh, 14px); }
.sumlist li { font-size: calc(clamp(15px, min(3.8cqw, 5cqh), 24px) * var(--k)); font-weight: 700; border-bottom: 1px dashed var(--line); padding-bottom: 4px; display: flex; gap: 10px; }
.sumlist li::before { content: "✔"; color: var(--accent); }

/* 4択 */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(6px, 1.8cqh, 12px); flex: none; }
.choice { border: 1.5px solid var(--line); background: var(--panel); border-radius: 5px; padding: clamp(6px, 1.8cqh, 14px) 12px; font-family: var(--font-en); font-size: calc(clamp(16px, min(3.8cqw, 4.8cqh), 26px) * var(--k)); text-align: left; display: flex; gap: 8px; align-items: baseline; }
.choice .kb { font-family: var(--font-body); font-size: 12px; color: var(--muted); }
.choice:hover:not(:disabled) { border-color: var(--ink); }
.choice.ok { border-color: var(--ok); background: var(--accent-soft); opacity: 1; }
.choice.ng { border-color: var(--ng); background: var(--warm-soft); opacity: 1; text-decoration: line-through; }

/* 並べかえ */
.slots { min-height: calc(clamp(38px, 9cqh, 58px) + 12px); border: 1.5px dashed var(--line); border-radius: 5px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; align-items: center; }
.slots.ok { border-style: solid; border-color: var(--ok); background: var(--accent-soft); }
.slots.ng { border-style: solid; border-color: var(--ng); background: var(--warm-soft); }
.slots .end { font-family: var(--font-en); font-size: calc(clamp(16px, min(4cqw, 5cqh), 26px) * var(--k)); }
.pool { display: flex; flex-wrap: wrap; gap: 6px; min-height: clamp(38px, 9cqh, 58px); flex: none; }
.tl { border: 1.5px solid var(--ink); background: var(--panel); border-radius: 5px; padding: 0 12px; height: clamp(36px, 9cqh, 56px); font-family: var(--font-en); font-size: calc(clamp(16px, min(4cqw, 5cqh), 26px) * var(--k)); box-shadow: 2px 2px 0 var(--ink); }
.tl:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.tl.used { visibility: hidden; }
.slots .tl { box-shadow: none; background: var(--bg); }
.slots .tl.bad { border-color: var(--ng); color: var(--ng); }

/* 瞬間英作文 */
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: none; }
.grade { border: 1.5px solid var(--ink); background: var(--panel); border-radius: 5px; padding: 8px 4px; font-weight: 700; font-size: 15px; line-height: 1.3; }
.grade small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
.grade.g0 { border-color: var(--ng); }
.grade.g2 { background: var(--accent); color: var(--accent-ink); }
.grade.g2 small { color: inherit; opacity: .8; }
.veil { border: 1.5px dashed var(--line); border-radius: 5px; display: grid; place-items: center; color: var(--muted); font-size: 14px; padding: 14px; min-height: 26%; background: transparent; width: 100%; }
.veil:hover { border-color: var(--ink); color: var(--ink); }

/* 結果 */
.result { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(8px, 2.6cqh, 18px); }
.score { font-family: var(--font-en); font-size: calc(clamp(40px, 16cqh, 96px) * var(--k)); font-weight: 600; line-height: 1; }
.score small { font-size: .4em; color: var(--muted); }
.bigstamp { font-family: var(--font-display); color: var(--warm); border: 4px double var(--warm); border-radius: 50%; width: clamp(80px, 26cqh, 150px); height: clamp(80px, 26cqh, 150px); display: grid; place-items: center; font-size: clamp(20px, 7cqh, 40px); font-weight: 800; transform: rotate(-12deg); animation: stamp .45s cubic-bezier(.2, 1.6, .5, 1); }
@keyframes stamp { from { transform: rotate(-30deg) scale(2.2); opacity: 0; } }
.misslist { font-size: 13.5px; text-align: left; max-width: 640px; width: 100%; margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.misslist li { font-family: var(--font-en); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.misslist li::before { content: "✕ "; color: var(--ng); }

.fbar { display: flex; align-items: center; gap: 10px; flex: none; }
.dots { flex: 1; display: flex; justify-content: center; gap: 5px; min-width: 0; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--ink); }
.dots i.ok { background: var(--accent); }
.dots i.ng { background: var(--warm); }
.fbar .btn.next { min-width: 8.5em; }
.kbd { font-size: 11.5px; color: var(--muted); }

/* ダイアログ */
dialog { border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--panel); color: var(--ink); padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow: hidden; box-shadow: 4px 4px 0 var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 28px); }
.dlg-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { font-family: var(--font-display); font-size: 19px; margin: 0; }
.dlg-head .x { margin-left: auto; }
.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 7px 12px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2.5px 0 var(--accent); }
.dlg-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; font-size: 14px; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.checks label small { color: var(--warm); font-family: var(--font-en); }
.fld { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fld input[type="text"], .fld input[type="date"] { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 5px 8px; flex: 1; min-width: 8em; }
.out { width: 100%; border: 1.5px solid var(--ink); background: var(--bg); border-radius: 3px; padding: 6px 8px; font-size: 12.5px; resize: none; height: 5.6em; }
.tlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13.5px; }
.tlist li { display: flex; gap: 8px; }
.tlist li span { margin-left: auto; font-weight: 700; }
.tlist li span.p { color: var(--accent); }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 6px 14px; border-radius: 4px; font-size: 14px; z-index: 99; pointer-events: none; }


/* ===== ごほうび ===== */
.ibtn.coin { display: inline-flex; align-items: center; gap: 4px; }
.ibtn.coin b { font-family: var(--font-en); font-weight: 600; }
.ibtn.coin .lv { font-size: 11px; border: 1px solid var(--gold); color: var(--gold); border-radius: 3px; padding: 0 4px; line-height: 1.5; }
.plus { position: fixed; z-index: 99; transform: translateX(-50%); font-family: var(--font-en); font-weight: 600; color: var(--gold); font-size: 16px; pointer-events: none; animation: plus .9s ease-out forwards; }
@keyframes plus { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: 26px; } }
.celebrate { position: fixed; left: 50%; top: 6px; transform: translateX(-50%); z-index: 130; background: var(--panel); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 22px; padding: 4px 16px; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; max-width: calc(100vw - 16px); pointer-events: none; animation: celin .35s cubic-bezier(.2, 1.4, .5, 1); } /* 何も かくさない 小さな 帯 */
@keyframes celin { from { transform: translate(-50%, -140%); } }
.celebrate small { color: var(--muted); font-weight: 700; font-size: 12px; }
.celebrate b { font-family: var(--font-display); font-size: 18px; color: var(--warm); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.4); opacity: 0; } }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.seg button { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 4px 10px; font-size: 13.5px; font-weight: 500; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--panel); font-weight: 700; }
.fl { font-size: 12.5px; color: var(--muted); min-width: 4.5em; }
.sep { border: 0; border-top: 1px dashed var(--line); margin: 4px 0; width: 100%; }
.fld select { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 3px 6px; }
.rwbody { display: grid; grid-template-columns: 240px 1fr; gap: 12px; }
.lvcard { border: 1.5px solid var(--ink); border-radius: 5px; padding: 10px; background: var(--bg); display: flex; flex-direction: column; gap: 4px; }
.lvcard small { color: var(--muted); font-size: 12px; }
.lvname { font-family: var(--font-display); font-size: 40px; line-height: 1.1; color: var(--warm); }
.pbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--gold); }
.lvstats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; margin-top: 4px; }
.best { border-collapse: collapse; font-size: 12px; margin-top: 6px; width: 100%; }
.best th, .best td { border: 1px solid var(--line); padding: 1px 4px; text-align: center; font-weight: 500; }
.best td { font-family: var(--font-en); }
.badges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; align-content: start; }
.bd { cursor: pointer; border: 1px solid var(--gold); border-radius: 5px; padding: 4px; text-align: center; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.bd i { font-style: normal; font-size: 22px; line-height: 1.2; }
.bd b { font-size: 11.5px; line-height: 1.3; }
.bd small { font-size: 10px; color: var(--muted); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.bd.off { border-color: var(--line); color: var(--muted); background: var(--bg); } /* うすくしすぎず 読める 濃さ */
.rwnote { grid-column: 1 / -1; }

/* ===== ゲームのトップ ===== */
.hub { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hubp { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden; }
.hubp h3 { font-family: var(--font-display); font-size: 24px; margin: 0; }
.hubp .fld { flex-wrap: nowrap; }
.hubp .fld input { min-width: 0; }
.hubp .fld.rng { flex-wrap: wrap; row-gap: 6px; }
.hubp .fld.rng .rangebtn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fld.go { margin-top: auto; }
.fld.teacher { margin-top: auto; border-top: 1px dashed var(--line); padding-top: 8px; flex-wrap: wrap !important; gap: 6px; }
/* 3 つの コース（寿司打の お手軽・お勧め・高級 のように えらぶだけで スタート） */
.lvs { flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 8px; max-height: 330px; }
.lvb { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 10px; align-items: center; text-align: left;
  border: 2px solid var(--line); border-radius: 10px; padding: 6px 12px; background: var(--panel); color: var(--ink); cursor: pointer; min-height: 0;
  transition: transform .12s, box-shadow .12s; box-shadow: 0 3px 0 rgba(0,0,0,.12); font: inherit; }
.lvb:hover { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(0,0,0,.14); }
.lvb:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.14); }
.lvb i { grid-row: 1 / 3; font-style: normal; font-size: 30px; line-height: 1; }
.lvb b { font-family: var(--font-display); font-size: 19px; line-height: 1.2; }
.lvb small { grid-column: 2; font-size: 12px; color: var(--muted); line-height: 1.3; }
.lvb .lvbest { grid-column: 3; grid-row: 1 / 3; text-align: right; font-size: 11px; color: var(--muted); line-height: 1.1; }
.lvb .lvbest em { display: block; font-style: normal; font-family: var(--font-en); font-size: 20px; color: var(--ink); }
.lvb.lv-easy { border-color: #7bc6a4; background: linear-gradient(100deg, rgba(123,198,164,.18), transparent 70%), var(--panel); }
.lvb.lv-std { border-color: var(--accent); background: linear-gradient(100deg, var(--accent-soft), transparent 70%), var(--panel); }
.lvb.lv-long { border-color: #c9a03a; background: linear-gradient(100deg, #1d2547, #2c3566 70%, #3a2f5c); color: #fff; }
.lvb.lv-long small, .lvb.lv-long .lvbest { color: #d9cfa8; }
.lvb.lv-long .lvbest em, .lvb.lv-long b { color: #ffe08a; }
.btn.big { font-size: 17px; padding: 9px 22px; }
.bestv { color: var(--muted); font-size: 13px; }
.bestv b { font-family: var(--font-en); color: var(--ink); font-size: 18px; }
.warnbox { border-left: 3px solid var(--warm); padding-left: 10px; font-size: 14px; }
.rwbtn { margin-left: auto; }

/* ===== プレイ中 ===== */
.hud { display: flex; align-items: center; gap: 10px; flex: none; }
.tbar { flex: 1; position: relative; height: 26px; border: 1.5px solid var(--ink); border-radius: 13px; overflow: hidden; background: var(--panel); }
.tbar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); transition: width .1s linear; }
.tbar i.hurry { background: var(--warm); }
.tbar span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 13px; mix-blend-mode: difference; color: #fff; }
.tbar.host { flex: none; height: 12px; }
.hs { text-align: right; line-height: 1.1; min-width: 6em; }
.hs small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; }
.hs b { font-family: var(--font-en); font-size: 28px; }
.hc { min-width: 6.5em; text-align: center; font-weight: 700; color: var(--warm); font-size: 13px; }
.hc b { font-family: var(--font-en); font-size: 24px; }
.hc i { font-style: normal; margin-left: 4px; background: var(--gold); color: var(--panel); border-radius: 3px; padding: 0 4px; font-size: 12px; }
.count { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
.count b { font-family: var(--font-en); font-size: clamp(60px, 30cqh, 200px); line-height: 1; color: var(--warm); }
.count small { color: var(--muted); font-size: 14px; max-width: 30em; }
.tl.shake { border-color: var(--ng); color: var(--ng); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.slots span.tl { display: inline-flex; align-items: center; }
.phrase { margin: 0; font-size: calc(clamp(15px, min(3.4cqw, 4.4cqh), 22px) * var(--k)); }
.phrase b { color: var(--warm); }
.tstats { margin: 0; font-size: 14px; color: var(--muted); }
.bigstamp.newrec { width: clamp(70px, 20cqh, 120px); height: clamp(70px, 20cqh, 120px); font-size: clamp(16px, 5cqh, 28px); }
.bigstamp.wait { color: var(--accent); border-color: var(--accent); }

/* ===== クラス対戦：先生の画面（プロジェクター） ===== */
.host { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; }
.hostL { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden; }
.roomhd small { color: var(--muted); font-size: 13px; }
.code { font-family: var(--font-en); font-weight: 600; font-size: 64px; line-height: 1; letter-spacing: .08em; color: var(--warm); }
.qr { flex: 1 1 auto; min-height: 60px; max-height: 200px; display: flex; justify-content: center; }
.qr svg { height: 100%; width: auto; background: #fff; border-radius: 4px; }
.joinhow { text-align: center; margin: 0; }
.hcfg { display: flex; flex-direction: column; gap: 4px; }
.hcfg .fld { gap: 6px; flex-wrap: nowrap; }
.hcfg .seg button { padding: 2px 8px; font-size: 12.5px; }
.hbtns { display: flex; align-items: center; gap: 8px; }
.hbtns .btn.main { flex: 1; }
.hbtns.sm .btn { flex: 1; padding: 4px 6px; font-size: 12.5px; }
.ppl { font-size: 14px; white-space: nowrap; }
.ppl b { font-family: var(--font-en); font-size: 22px; }
.board { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden; container-type: size; }
.bhead { display: flex; align-items: center; gap: 6px 10px; flex: none; flex-wrap: wrap; }
.btabs { flex: none; }
.bhead > b { font-family: var(--font-display); font-size: clamp(18px, 4.2cqh, 34px); }
.btabs { margin-left: auto; display: flex; gap: 2px; }
.btabs button { white-space: nowrap; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 3px 10px; font-weight: 700; font-size: 13px; color: var(--muted); }
.btabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.champ { flex: none; font-family: var(--font-display); font-size: clamp(18px, 5cqh, 40px); color: var(--warm); text-align: center; animation: pop .5s; }
.bbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.rk { flex: 1; min-height: 0; list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; gap: 3px 18px; }
.rk li { display: grid; grid-template-columns: 2em minmax(0, 36%) minmax(0, 1fr) 3.8em; align-items: center; gap: 6px; min-height: 0; min-width: 0; line-height: 1.2; overflow: hidden; border-bottom: 1px dashed var(--line); }
.rk li.more { display: flex; justify-content: center; color: var(--muted); font-size: .8em; }
.rk.mine { margin-top: 4px; padding-top: 4px; border-top: 1.5px dashed var(--line); flex: none; }
.rk .rn { text-align: center; font-family: var(--font-en); font-weight: 600; line-height: 1; font-size: .9em; }
.rk .rn, .rk .nm, .rk .sc { max-height: 100%; }
.rk .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk .fire { font-style: normal; font-size: .7em; color: var(--warm); }
.rk .bar { height: 58%; max-height: 22px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.rk .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.rk .top1 .bar i { background: var(--gold); }
.rk .top .nm { color: var(--warm); }
.rk .sc { text-align: right; font-family: var(--font-en); font-weight: 600; }
.rk li.me { background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; overflow: hidden; }
.chipn { border: 1.5px solid var(--ink); border-radius: 16px; padding: 2px 12px; background: var(--bg); font-weight: 700; font-size: clamp(13px, 3.4cqh, 22px); animation: pop2 .3s; }
.chipn.me { background: var(--accent); color: var(--accent-ink); }
.chips.small .chipn { font-size: 12px; padding: 0 8px; }
@keyframes pop2 { from { transform: scale(.5); opacity: 0; } }
.result .rk { width: min(560px, 100%); flex: none; grid-auto-flow: row; }
.result .rk li { font-size: 14px; padding: 1px 0; }
.fld.center { justify-content: center; }
.bigin { font-family: var(--font-en); font-size: 34px; text-align: center; letter-spacing: .2em; width: 6em; flex: none !important; }

@media (max-width: 720px) {
  .tools .ibtn.coin .lv { display: none; }
  .hub { grid-template-columns: 1fr; grid-template-rows: auto auto; gap: 8px; align-content: start; }
  .hubp { padding: 10px 12px; gap: 6px; }
  .hubp h3 { font-size: 18px; }
  .hubp > .note { display: none; }
  .fld.go, .fld.teacher { margin-top: 0; }
  .lvs { flex: none; grid-template-rows: none; gap: 6px; }
  .lvb { padding: 4px 10px; }
  .lvb i { font-size: 24px; }
  .lvb b { font-size: 16px; }
  .lvb small { font-size: 11px; }
  .lvb .lvbest em { font-size: 17px; }
  .rwbtn { padding: 4px 8px; font-size: 12.5px; }
  .ubar .utitle small { display: none; }
  .hud { gap: 6px; }
  .hc { min-width: 4.5em; font-size: 11px; }
  .hc b { font-size: 18px; }
  .hs { min-width: 4.5em; }
  .hs b { font-size: 22px; }
  .host { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .hostL { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
  .hostL .qr, .hostL .joinhow { display: none; }
  .hostL .hsum { grid-column: 1 / -1; }
  .code { font-size: 40px; }
  .hbtns, .hbtns.sm { grid-column: 1 / -1; }
  .rwbody { grid-template-columns: 1fr; gap: 8px; }
  .lvname { font-size: 28px; }
  .best { display: none; }
  .bd small { display: none; }
  .bd i { font-size: 18px; }
  .rwnote { display: none; }
}
@media (max-width: 720px) and (max-height: 640px) and (orientation: portrait) {
  .tools .ibtn.coin b { font-size: 12px; }
}
@media (max-width: 400px) {
  .brand { display: none; }
}
@media (max-height: 500px) and (orientation: landscape) {
  body[data-view="game"] .top { display: none; }
  .hub { gap: 8px; }
  .hubp { padding: 8px 12px; gap: 5px; }
  .hubp h3 { font-size: 17px; }
  .hubp > .note { display: none; }
  .gamebtn { display: none; }
  .hub { grid-template-columns: 1fr 1fr; grid-template-rows: none; }
  .hubp .fld { flex-wrap: wrap; gap: 4px; }
  .rwbody { grid-template-columns: 190px 1fr; }
  .lvname { font-size: 26px; }
  .bd small { display: none; }
  .bd i { font-size: 16px; }
  .bd b { font-size: 10.5px; }
  .badges { gap: 4px; }
  .host { grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: none; }
  .hostL { display: flex; }
  .hostL .qr { display: none; }
  .hostL .hsum p:nth-child(2), .hostL .hsum p:nth-child(4) { display: none; }
  .code { font-size: 36px; }
  .hbtns { flex-wrap: wrap; }
  .hbtns .btn.big { font-size: 15px; padding: 6px 10px; }
}


/* ===== 演出（効果音つきの 楽しい見た目） ===== */
.fxcanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 130; }
.fxpop { position: fixed; z-index: 125; transform: translate(-50%, -100%); pointer-events: none; font-family: var(--font-en); font-weight: 600; font-size: 18px; color: var(--gold); text-shadow: 0 1px 0 var(--panel), 0 0 6px var(--panel); white-space: nowrap; animation: fxup .9s ease-out forwards; }
.fxpop.big { font-size: clamp(26px, 6vw, 46px); color: var(--warm); font-family: var(--font-display); animation: fxbig .9s cubic-bezier(.2, 1.6, .5, 1) forwards; }
.fxpop.go { font-size: clamp(60px, 16vw, 140px); color: var(--accent); animation: fxbig .8s cubic-bezier(.2, 1.6, .5, 1) forwards; }
@keyframes fxup { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -40px; } }
@keyframes fxbig { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }
#hscore.bump { animation: bump .25s; display: inline-block; }
@keyframes bump { 40% { transform: scale(1.25); color: var(--gold); } }
.play .card { transition: box-shadow .3s, border-color .3s; }
.play .card[data-combo="1"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), 0 0 22px var(--accent-soft); }
.play .card[data-combo="2"] { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(233, 183, 48, .35), 0 0 30px rgba(233, 183, 48, .35); }
.play .card[data-combo="3"] { border-color: var(--warm); box-shadow: 0 0 0 3px var(--warm-soft), 0 0 40px rgba(217, 96, 59, .45); }
@keyframes hot { to { box-shadow: 0 0 0 5px var(--warm-soft), 0 0 60px rgba(217, 96, 59, .6); } }
.card.f-ok { animation: fok .35s; }
.card.f-ng { animation: shake .3s; }
@keyframes fok { 30% { background: var(--accent-soft); } }
.count .cd { animation: cdz .9s cubic-bezier(.2, 1.6, .5, 1); }
@keyframes cdz { from { transform: scale(2.4); opacity: 0; } 40% { opacity: 1; } }
.tbar.hurry { animation: hurry .5s ease-in-out infinite alternate; border-color: var(--warm); }
@keyframes hurry { to { transform: scale(1.02); box-shadow: 0 0 12px var(--warm-soft); } }
.hc b { display: inline-block; animation: bump .25s; }
.hr { text-align: center; line-height: 1.1; font-size: 12px; color: var(--muted); min-width: 4em; border: 1.5px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.hr b { font-family: var(--font-en); font-size: 22px; color: var(--ink); }
.hr.first { border-color: var(--gold); background: rgba(233, 183, 48, .15); }
.hr.first b { color: var(--gold); }

/* ゲームのトップを にぎやかに */
.hubp.ta { border-top: 6px solid var(--accent); background: linear-gradient(170deg, var(--accent-soft), transparent 45%), var(--panel); }
.hubp.vs { border-top: 6px solid var(--warm); background: linear-gradient(170deg, var(--warm-soft), transparent 45%), var(--panel); }
.hico { display: inline-block; animation: wob 2.4s ease-in-out infinite; }
.hubp.vs .hico { animation-delay: .6s; }
@keyframes wob { 0%, 70%, 100% { transform: none; } 80% { transform: rotate(-14deg) scale(1.15); } 90% { transform: rotate(10deg) scale(1.15); } }
.hubp .btn.main.big { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: translateY(-2px); box-shadow: 3px 5px 0 var(--ink); } }
.rangebtn { border-style: dashed; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.rangebtn.on, .hubp .rangebtn { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }

/* 単元えらび */
.pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pku { border: 1.5px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 8px; text-align: left; display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.pku small { font-family: var(--font-en); color: var(--warm); font-size: 12px; }
.pku b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pku[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); box-shadow: 2px 2px 0 var(--ink); }
.pku[aria-pressed="true"] small { color: inherit; }
.pku[aria-pressed="true"] b::before { content: "✔ "; }
.pkfoot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pkfoot > span { margin-right: auto; }
.pkfoot b { font-family: var(--font-en); font-size: 18px; }
.tabs .badge { margin-left: 4px; }

/* 先生の画面：待合室・プレイ中 */
.bh { display: flex; flex-direction: column; gap: 8px; flex: none; }
.bign { font-family: var(--font-en); color: var(--warm); font-size: 1.3em; display: inline-block; animation: bump .3s; }

/* ===== わかりやすい説明：図・ひとことで言うと・まちがえやすいところ ===== */
.core .coreh { display: flex; align-items: center; gap: clamp(8px, 2cqw, 18px); }
.cico { font-size: calc(clamp(40px, min(11cqw, 15cqh), 96px) * var(--k)); line-height: 1; animation: bob 2.4s ease-in-out infinite; flex: none; }
.h.catch { color: var(--warm); font-size: calc(clamp(20px, min(5.6cqw, 7.4cqh), 42px) * var(--k)); }
.exb { display: flex; align-items: flex-start; gap: 8px; }
.exb .en { margin-bottom: 2px; }
.say.mini { flex: none; padding: 3px 8px; margin-top: .2em; }
.cin.pt .mid { gap: clamp(5px, 1.8cqh, 16px); }
.cin.pt .body { font-size: calc(clamp(14px, min(3.2cqw, 4.2cqh), 20px) * var(--k)); }
.fig { --fs: calc(clamp(12px, min(2.9cqw, 3.9cqh), 19px) * var(--k)); font-size: var(--fs); flex: none; position: relative; }
/* slots */

/* 高さの低いカード：図があるときは「型」の枠を省く（図が同じ役目）・すき間を詰める */
@container (max-height: 620px) {
  :root[data-size="2"] .cin.pt .hasfig .form { display: none; }
  :root[data-size="2"] .cin.pt .mid { gap: 6px; }
}
@container (max-height: 470px) {
  :root[data-size="2"] .cin.pt .hasfig .exb .ja { display: none; }
}
@container (max-height: 470px) {
  .cin.pt .hasfig .form { display: none; }

  .cin.pt .mid { gap: 5px; }
  .cin.pt .h { font-size: calc(clamp(18px, min(5cqw, 6.4cqh), 32px) * var(--k)); }
}
@container (max-height: 400px) {
  .cin.pt .hasfig .exb .ja { display: none; }
  .cin.pt .body { line-height: 1.55; }
  .fig { --fs: calc(clamp(11px, min(2.7cqw, 3.6cqh), 16px) * var(--k)); }
  .fscale { padding-top: calc(var(--fs) * 1.6); }
  .tmk { height: calc(var(--fs) * 2.3); }
  .cin.pt .mid { gap: 3px; }
  .cin.pt .h { font-size: calc(clamp(16px, min(4.6cqw, 6cqh), 26px) * var(--k)); }
  .cin.pt .exb .ja { display: none; }
  .cin .choices + .row { display: none; }
  .ja.big { font-size: calc(clamp(16px, min(4.4cqw, 5.6cqh), 28px) * var(--k)); }
  .mid:has(.slots.ng) .ja.big { display: none; }
  .slots.ng .tl { height: auto; padding: 1px 7px; font-size: calc(clamp(13px, min(3.4cqw, 4.2cqh), 20px) * var(--k)); }
  .slots.ng { min-height: 0; padding: 4px; gap: 4px; }

}
.steps { padding-right: 3px; }
.sl { border: 2px solid var(--rc); border-radius: 6px; background: var(--rb); display: flex; flex-direction: column; align-items: center; min-width: 3.2em; overflow: hidden; }
.sl b { font-family: var(--font-en); font-weight: 600; padding: 2px 10px; font-size: 1.12em; white-space: nowrap; }
.sl i { font-style: normal; font-weight: 700; background: var(--rc); color: var(--panel); width: 100%; text-align: center; font-size: .82em; line-height: 1.5; }
.sl i small { font-weight: 400; margin-left: 3px; font-size: .9em; }
.r-S { --rc: var(--blue); --rb: var(--blue-soft); }
.r-V { --rc: var(--warm); --rb: var(--warm-soft); }
.r-O { --rc: var(--accent); --rb: var(--accent-soft); }
.r-C { --rc: var(--gold); --rb: rgba(184, 138, 18, .15); }
.r-M { --rc: #7a4fa3; --rb: rgba(122, 79, 163, .14); }
.r-X { --rc: var(--muted); --rb: var(--chip); }
:root[data-theme="dark"] .r-M { --rc: #c3a3e6; }
.fslots svg.arcs { position: absolute; left: 0; top: 0; pointer-events: none; color: var(--warm); overflow: visible; }
.arcl { position: absolute; transform: translateX(-50%); font-size: .8em; font-weight: 700; color: var(--warm); padding: 0 4px; white-space: nowrap; line-height: 1.4; }
/* time */
.ftime { padding: 0 1.5em; }
.tmarks { display: flex; flex-direction: column; gap: 2px; }
.tmk { position: relative; height: calc(var(--fs) * 2.6); }
.tmk .band { position: absolute; bottom: 3px; height: 9px; border-radius: 5px; background: var(--tc); min-width: 8px; }
.tmk .band.r::after, .tmk .band.l::before { content: ""; position: absolute; top: -5px; border: 9px solid transparent; }
.tmk .band.r::after { right: -14px; border-left-color: var(--tc); }
.tmk .band.l::before { left: -14px; border-right-color: var(--tc); }
.tmk .dot { position: absolute; bottom: 0; width: 15px; height: 15px; border-radius: 50%; background: var(--tc); transform: translateX(-50%); border: 2px solid var(--panel); }
.tmk .tl0 { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; font-weight: 700; color: var(--tc); font-size: .9em; }
.tm0 { --tc: var(--warm); } .tm1 { --tc: var(--blue); } .tm2 { --tc: var(--accent); }
.taxis { position: relative; height: calc(var(--fs) * 1.7); border-top: 2px solid var(--ink); margin-top: 4px; display: flex; justify-content: space-between; font-size: .82em; color: var(--muted); }
.taxis::after { content: ""; position: absolute; right: -10px; top: -7px; border: 6px solid transparent; border-left: 9px solid var(--ink); }
.taxis .now { position: absolute; left: 50%; transform: translateX(-50%); color: var(--ink); font-weight: 700; }
.taxis .now::before { content: ""; position: absolute; left: 50%; top: -9px; width: 2px; height: 14px; background: var(--ink); }
/* scale */
.fscale { padding: calc(var(--fs) * 1.9) 1.2em calc(var(--fs) * 0.2); }
.sbar { position: relative; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--blue-soft), var(--accent), var(--warm)); margin-bottom: calc(var(--fs) * 1.8); }
.pin { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 3px solid var(--ink); transform: translate(-50%, -50%); }
.pin b { position: absolute; left: 50%; transform: translateX(-50%); font-family: var(--font-en); font-weight: 600; white-space: nowrap; font-size: 1.05em; }
.pin.up b { bottom: 14px; }
.pin.er b { left: auto; right: -6px; transform: none; }
.pin.el b { left: -6px; transform: none; }
.pin.dn b { top: 14px; }
.sends { display: flex; justify-content: space-between; font-size: .8em; color: var(--muted); }
/* flow */
.fflow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.fs { border: 2px solid var(--ink); border-radius: 18px; padding: 2px 14px; font-weight: 700; background: var(--panel); box-shadow: 2px 2px 0 var(--ink); }
.fs0 { background: var(--warm-soft); } .fs1 { background: var(--blue-soft); } .fs2 { background: var(--accent-soft); } .fs3 { background: rgba(184, 138, 18, .16); } .fs4 { background: var(--chip); }
.fa { color: var(--muted); font-weight: 700; }
/* vs */
.fvs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 8px; }
.vb { border: 2px solid var(--vc); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--vbg); min-width: 0; }
.vb b { font-family: var(--font-en); font-weight: 500; font-size: 1.05em; line-height: 1.3; }
.vb small { font-weight: 700; color: var(--vc); font-size: .9em; }
.va { --vc: var(--accent); --vbg: var(--accent-soft); }
.vbb { --vc: var(--blue); --vbg: var(--blue-soft); }
.vsx { align-self: center; font-family: var(--font-en); font-weight: 600; color: var(--warm); font-size: .9em; }

/* 絵（pic）・くらべる棒（bars） */
.fpic .pbox { position: relative; width: min(100%, 62cqh); aspect-ratio: 2 / 1; margin: 0 auto; container-type: inline-size; border-radius: 10px; background: linear-gradient(180deg, var(--bg), var(--panel)); border: 1px dashed var(--line); }
.parr { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--warm); overflow: visible; }
.parr .pal { font-size: 9.5px; font-weight: 700; fill: var(--warm); paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; font-family: var(--font-body); }
.pal2 { position: absolute; z-index: 2; transform: translate(-50%, -100%); white-space: nowrap; font-size: max(10.5px, 3.9cqw); font-weight: 700; color: var(--warm); background: var(--panel); border: 1.5px solid var(--warm); border-radius: 10px; padding: 0 7px; line-height: 1.5; box-shadow: 0 1px 0 var(--line); }
.pit { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; line-height: 1; }

.pl { margin-top: 1px; font-size: max(11px, 4.4cqw); font-weight: 700; white-space: nowrap; color: var(--ink); background: var(--panel); border-radius: 3px; padding: 0 3px; font-family: var(--font-en); }
.pbub { position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: max(11px, 4.2cqw); font-weight: 700; background: var(--panel); border: 1.5px solid var(--ink); border-radius: 12px; padding: 2px 8px; line-height: 1.3; }
.pbub::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--ink); }
.pcap { margin: 4px 0 0; text-align: center; font-weight: 700; font-size: max(13px, 1em); color: var(--accent); }
.fbars { display: flex; flex-direction: column; gap: 5px; }
.bri { display: grid; grid-template-columns: minmax(4em, 9em) 1fr; gap: 8px; align-items: center; }
.brl { font-family: var(--font-en); font-weight: 600; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brb { height: 1.1em; background: var(--chip); border-radius: 4px; overflow: hidden; }
.brb i { display: block; height: 100%; border-radius: 4px; animation: growx .7s ease-out; transform-origin: left; }
.bc0 { background: var(--accent); } .bc1 { background: var(--blue); } .bc2 { background: var(--warm); } .bc3 { background: var(--gold); }
@keyframes growx { from { transform: scaleX(0); } }
/* まちがえやすいところ */
.nglist { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(6px, 2.2cqh, 16px); }

.nglist .good { font-family: var(--font-en); font-weight: 600; color: var(--ok); font-size: calc(clamp(15px, min(3.6cqw, 4.4cqh), 24px) * var(--k)); }
.nglist .why { font-size: calc(clamp(12.5px, min(2.9cqw, 3.6cqh), 17px) * var(--k)); color: var(--muted); }
@media (max-width: 720px) {
  .sl b { padding: 1px 6px; }
  .fvs { grid-template-columns: 1fr; gap: 4px; }
  .vsx { display: none; }
}

.qb .tx { font-family: var(--font-en); font-weight: 600; font-size: clamp(14px, 3.6cqh, 22px); line-height: 1.2; text-align: center; }
.qzbtns.long .qb .tx { text-align: left; font-size: clamp(13px, 3cqh, 18px); }
.qzwait, .qzres { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.qb.big { width: 34cqmin; height: 34cqmin; max-width: 160px; max-height: 160px; cursor: default; animation: pop .4s; }
.qb.big.none { background: var(--muted); }
.qb.big .sh { font-size: 70px; }
.qzres .mk { font-family: var(--font-display); font-size: clamp(28px, 8cqh, 56px); animation: pop .4s cubic-bezier(.2, 1.6, .5, 1); }
.qzres.ok .mk { color: var(--accent); } .qzres.ng .mk { color: var(--warm); }
.qzres .pt { font-family: var(--font-en); font-weight: 700; font-size: clamp(20px, 6cqh, 34px); margin: 0; }
.qzres .ans { font-family: var(--font-en); font-size: clamp(15px, 4cqh, 22px); margin: 0; }
.qzres .ans .sh { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 6px; background: var(--qc); color: var(--qt, #fff); }
.qzres .rk { margin: 0; font-size: 16px; display: flex; align-items: baseline; justify-content: center; gap: 6px; white-space: nowrap; }
.qzres .rk b { font-family: var(--font-en); font-size: 2em; line-height: 1; }
.qzres .rk.big b { font-size: clamp(48px, 16cqh, 96px); }
.qzres .mk { white-space: nowrap; }
.qblank { display: inline-block; width: 3.2em; height: .9em; border-bottom: 3px solid var(--warm); margin: 0 .25em; vertical-align: baseline; }
.qzres .fire { color: #ff7a1a; }
.qstat ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.qstat li { display: grid; grid-template-columns: 1.8em minmax(0, 1fr) 7.5em; gap: 8px; align-items: center; padding: 3px 6px; border-radius: 6px; background: var(--bg); }
.qstat .no { font-family: var(--font-en); font-weight: 700; text-align: center; }
.qstat .tx { display: flex; flex-direction: column; min-width: 0; }
.qstat .tx b { font-family: var(--font-en); font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qstat .tx small { color: var(--muted); font-size: 11px; }
.qstat .pc { position: relative; height: 22px; border-radius: 11px; background: var(--chip); overflow: hidden; }
.qstat .pc i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.qstat li.mid .pc i { background: var(--gold); } .qstat li.lo .pc i { background: var(--warm); }
.qstat .pc b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-en); font-size: 14px; color: var(--ink); text-shadow: 0 0 3px var(--panel), 0 0 3px var(--panel); }
.qstat li.lo { outline: 1.5px solid var(--warm); }
.qmiss { width: min(560px, 100%); text-align: left; font-size: 13px; display: flex; flex-direction: column; gap: 3px; border-top: 1.5px dashed var(--line); padding-top: 6px; }
.qmiss p { margin: 0; font-family: var(--font-en); line-height: 1.35; }
.qmiss p span { display: block; font-family: var(--font-body); color: var(--muted); font-size: 11.5px; }
.qmiss em { font-style: normal; font-weight: 700; color: var(--warm); }
.qmiss.ok { text-align: center; font-weight: 700; color: var(--accent); border: 0; }
.champ .replay { vertical-align: middle; }
/* クイズの 結果（生徒）：小さい 画面では 大きな メダルを はぶいて「まちがえた 問題」を 見せる */
@container (max-height: 700px) {
  .result:has(.qmiss) { gap: 4px; }
  .result:has(.qmiss) .winner .crown { display: none; }
  .result:has(.qmiss) .winner b { font-size: 26px; }
  .result:has(.qmiss) .score { font-size: 44px; }
  .result:has(.qmiss) > .note:last-child { display: none; }
}
@container (max-height: 560px) {
  .result:has(.qmiss) .h { display: none; }
  .qmiss p span { display: none; }
  .result:has(.qmiss) .rk li:nth-child(n+4):not(.me) { display: none; }
}
.qb.picked { opacity: .5; position: relative; transform: scale(.96); }
.qb.picked::after { content: attr(data-n); position: absolute; top: 6px; right: 8px; width: 1.7em; height: 1.7em; border-radius: 50%; background: #fff; color: #222; font-family: var(--font-en); font-weight: 700; display: grid; place-items: center; font-size: 18px; }
.qzseq { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
.qb.big.seq { background: var(--accent); }
.qzopts.seq { grid-template-columns: 1fr; }
.qzopts.seq .qo { outline: 0; transform: none; }
.qo .no4 { flex: none; width: 1.6em; height: 1.6em; border-radius: 50%; background: #fff; color: #222; display: grid; place-items: center; font-family: var(--font-en); font-weight: 700; font-size: clamp(16px, 4cqh, 30px); }
@media (max-width: 720px) and (max-height: 600px) {
  .lvb small { display: none; }
  .lvb { padding: 2px 10px; }
  .lvs { gap: 4px; }
  .lvb i { font-size: 20px; }
  .lvb .lvbest em { font-size: 15px; }
  .hubp .rangebtn { padding: 3px 8px; font-size: 12.5px; }
}
.qzres .mine { margin: 0; font-size: 14px; color: var(--warm); font-family: var(--font-en); }
.qzres .mine + .note { margin: 0; }
.qzbusy { flex: 1; text-align: center; font-weight: 700; color: var(--accent); }
.howjoin { flex: none; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px; margin-bottom: 8px; border: 2px dashed var(--accent); border-radius: 10px; background: var(--accent-soft); font-weight: 700; font-size: clamp(14px, 3cqh, 24px); text-align: center; }
.howjoin b { font-family: var(--font-en); font-size: clamp(28px, 8cqh, 64px); letter-spacing: .12em; color: var(--warm); line-height: 1; }
.champ .replay { font-size: 14px; padding: 6px 12px; }
button.chipn { font-family: inherit; cursor: pointer; }
button.chipn:hover { text-decoration: line-through; }
.kicknote { flex: none; text-align: center; margin: 4px 0 0; }
body[data-room] .tools, body[data-room] .cnav { visibility: hidden; pointer-events: none; }
/* 横向きスマホなど：入りきらない ダイアログは 中だけ スクロール（ほかの 画面は スクロールなし） */
.dlg-body { overflow-y: auto; overscroll-behavior: contain; }
@media (max-width: 420px) { .checks { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .bd small { display: -webkit-box; -webkit-line-clamp: 1; font-size: 9.5px; } }
/* iPad 縦（760〜900px）：単元は 3 列 */
@media (min-width: 760px) and (max-width: 900px) and (orientation: portrait) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; grid-template-rows: repeat(4, minmax(0, 1fr)) !important; }
}
@media (max-height: 500px) and (orientation: landscape) { :root[data-size="2"] { --k: 1.05; } }
.firstrun { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 4px 8px; line-height: 1.4; }
@media (min-width: 721px) { .firstrun { display: none; } } /* 広い 画面は 下の「おぼえ方」が 出る */
